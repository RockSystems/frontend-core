name: Release

# Вливання в main з новою version у package.json → пакет на npmjs.com і тег v…. Руками нічого не ставимо.
# Токена немає: npm довіряє саме цьому файлу через trusted publishing, тож ім'я файла не міняємо.
# Дії закріплені за комітом: цей файл публікує код у всі проєкти.
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Чи є що публікувати
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
            echo "Версія $VERSION уже опублікована, нічого робити."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.version.outputs.publish == 'true'
      - run: npm run check
        if: steps.version.outputs.publish == 'true'
      - run: npm publish
        if: steps.version.outputs.publish == 'true'
      - name: Тег версії
        if: steps.version.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
